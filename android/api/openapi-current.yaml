        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyTimetable'
          description: ''
  /api/timetable/weekly-timetables/{id}/unpublish/:
    post:
      operationId: timetable_weekly_timetables_unpublish_create
      description: Unpublish a timetable (convert back to draft)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this weekly timetable.
        required: true
      tags:
      - timetable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyTimetable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WeeklyTimetable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WeeklyTimetable'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyTimetable'
          description: ''
  /api/timetable/weekly-timetables/generate_weekly_templates/:
    post:
      operationId: timetable_weekly_timetables_generate_weekly_templates_create
      description: Generate weekly timetable templates for all weeks in an academic
        period for a batch
      tags:
      - timetable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyTimetable'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WeeklyTimetable'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WeeklyTimetable'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyTimetable'
          description: ''
  /api/transcripts/{student_id}/:
    get:
      operationId: transcripts_retrieve
      description: Generate and download transcript for a student
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - transcripts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/transcripts/enqueue/:
    post:
      operationId: transcripts_enqueue_create
      description: |-
        Enqueue transcript generation as a background job.

        Request body:
            {
                "student_id": int,
                "email": str (optional)
            }
      tags:
      - transcripts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/transcripts/verify/{token}/:
    get:
      operationId: transcripts_verify_retrieve
      description: Verify a transcript QR token
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - transcripts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    AcademicPeriod:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        period_type:
          allOf:
          - $ref: '#/components/schemas/PeriodTypeEnum'
          description: |-
            Type of academic period

            * `YEAR` - Year
            * `BLOCK` - Block
            * `MODULE` - Module
        name:
          type: string
          description: Period name (e.g., 'Year 1', 'Block 1', 'Module A')
          maxLength: 128
        parent_period:
          type: integer
          nullable: true
          description: Parent period for hierarchical structure (YEAR -> BLOCK ->
            MODULE)
        parent_period_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          nullable: true
          description: Period start date
        end_date:
          type: string
          format: date
          nullable: true
          description: Period end date
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
      required:
      - created_at
      - id
      - name
      - parent_period_name
      - period_type
      - updated_at
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - state_transition
      - special_action
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
        * `state_transition` - State Transition
        * `special_action` - Special Action
    Address:
      type: object
      description: Serializer for Address model.
      properties:
        id:
          type: integer
          readOnly: true
        person:
          type: integer
          description: Person this address belongs to
        type:
          allOf:
          - $ref: '#/components/schemas/AddressTypeEnum'
          description: |-
            Type of address

            * `mailing` - Mailing Address
            * `permanent` - Permanent Address
            * `temporary` - Temporary Address
            * `work` - Work Address
        street:
          type: string
          description: Street address
          maxLength: 255
        city:
          type: string
          description: City
          maxLength: 100
        state:
          type: string
          description: State/Province
          maxLength: 100
        postal_code:
          type: string
          description: Postal/ZIP code
          maxLength: 20
        country:
          type: string
          description: Country
          maxLength: 100
        is_primary:
          type: boolean
          description: Is this the primary address?
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
      required:
      - city
      - created_at
      - id
      - person
      - street
      - type
      - updated_at
    AddressTypeEnum:
      enum:
      - mailing
      - permanent
      - temporary
      - work
      type: string
      description: |-
        * `mailing` - Mailing Address
        * `permanent` - Permanent Address
        * `temporary` - Temporary Address
        * `work` - Work Address
    Adjustment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        student_reg_no:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        term:
          type: integer
        term_name:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/AdjustmentKindEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reason:
          type: string
        requested_by:
          type: integer
          nullable: true
        approved_by:
          type: integer
          nullable: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AdjustmentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
      required:
      - amount
      - approved_at
      - created_at
      - id
      - kind
      - reason
      - status
      - student
      - student_name
      - student_reg_no
      - term
      - term_name
      - updated_at
    AdjustmentKindEnum:
      enum:
      - waiver
      - scholarship
      - adjustment
      - fine_reversal
      type: string
      description: |-
        * `waiver` - Waiver
        * `scholarship` - Scholarship
        * `adjustment` - Adjustment
        * `fine_reversal` - Fine Reversal
    AdjustmentStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    AdminUser:
      type: object
      description: Serializer for admin user management.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        role:
          type: string
          readOnly: true
        groups_list:
          type: string
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - full_name
      - groups_list
      - id
      - last_login
      - role
      - username
    AdminUserCreate:
      type: object
      description: Serializer for creating users.
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        role:
          type: string
          writeOnly: true
      required:
      - password
      - username
    AdminUserUpdate:
      type: object
      description: Serializer for updating users.
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        role:
          type: string
          writeOnly: true
      required:
      - username
    AppSetting:
      type: object
      description: Serializer for AppSetting.
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          description: Setting key (must be in allowlist)
          maxLength: 100
        value_json:
          description: Setting value (JSON-serializable)
        value_type:
          allOf:
          - $ref: '#/components/schemas/ValueTypeEnum'
          description: |-
            Type of the value

            * `boolean` - Boolean
            * `integer` - Integer
            * `string` - String
            * `json` - JSON
        description:
          type: string
          readOnly: true
          description: Description of this setting
        updated_by:
          type: integer
          nullable: true
          description: User who last updated this setting
        updated_by_username:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
      required:
      - created_at
      - description
      - id
      - key
      - updated_at
      - updated_by_username
      - value_json
      - value_type
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session:
          type: integer
          description: Session this attendance is for
        student:
          type: integer
          description: Student this attendance is for
        student_reg_no:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        session_department:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AttendanceStatusEnum'
          description: |-
            Attendance status

            * `PRESENT` - Present
            * `ABSENT` - Absent
            * `LATE` - Late
            * `LEAVE` - Leave
        marked_by:
          type: integer
          readOnly: true
          nullable: true
          description: User who marked this attendance
        marked_by_username:
          type: string
          readOnly: true
        marked_at:
          type: string
          format: date-time
          readOnly: true
          description: When this attendance was marked
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
      required:
      - created_at
      - id
      - marked_at
      - marked_by
      - marked_by_username
      - session
      - session_department
      - student
      - student_name
      - student_reg_no
      - updated_at
    AttendanceStatusEnum:
      enum:
      - PRESENT
      - ABSENT
      - LATE
      - LEAVE
      type: string
      description: |-
        * `PRESENT` - Present
        * `ABSENT` - Absent
        * `LATE` - Late
        * `LEAVE` - Leave
    AudienceTypeEnum:
      enum:
      - STUDENT
      - ALL_STUDENTS
      - SECTION
      - BATCH
      - PROGRAM
      - GROUP
      type: string
      description: |-
        * `STUDENT` - Student
        * `ALL_STUDENTS` - All Students
        * `SECTION` - Section
        * `BATCH` - Batch
        * `PROGRAM` - Program
        * `GROUP` - Group
    AuditLog:
      type: object
      description: Serializer for audit log entries.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
          description: User who performed the action
        actor_username:
          type: string
          readOnly: true
        method:
          type: string
          readOnly: true
          description: HTTP method (POST, PUT, PATCH, DELETE)
        path:
          type: string
          readOnly: true
          description: Request path
        status_code:
          type: integer
          readOnly: true
          description: HTTP status code
        entity:
          type: string
          readOnly: true
          description: Entity/model name (if applicable)
        entity_id:
          type: string
          readOnly: true
          description: Entity object ID (if applicable)
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
          description: |-
            Type of action performed

            * `create` - Create
            * `update` - Update
            * `delete` - Delete
            * `state_transition` - State Transition
            * `special_action` - Special Action
        summary:
          type: string
          readOnly: true
          description: Action summary
        metadata:
          readOnly: true
          nullable: true
          description: Additional metadata (request data, old/new values, etc.)
        ip_address:
          type: string
          readOnly: true
          nullable: true
          description: IP address of the request
        user_agent:
          type: string
          readOnly: true
          description: User agent string
        model:
          type: string
          readOnly: true
          description: Model name (deprecated, use entity instead)
        object_id:
          type: string
          readOnly: true
          description: Object ID (deprecated, use entity_id instead)
        request_data:
          readOnly: true
          nullable: true
          description: Request data (deprecated, use metadata instead)
      required:
      - action
      - actor
      - actor_username
      - entity
      - entity_id
      - id
      - ip_address
      - metadata
      - method
      - model
      - object_id
      - path
      - request_data
      - status_code
      - summary
      - timestamp
      - user_agent
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        program:
          type: integer
          description: Program this batch belongs to
        program_name:
          type: string
          readOnly: true
        name:
          type: string
          description: Batch name (e.g., '2024 Batch', 'Fall 2024')
          maxLength: 128
        start_year:
          type: integer
          maximum: 32767
          minimum: 0
          description: 'Graduation year for this batch (not intake year). Example:
            Students enrolling in 2026 for a 5-year program would have start_year=2031.'
        year:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          description: Whether this batch is currently active
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
      required:
      - created_at
      - id
      - name
      - program
      - program_name
      - start_year
      - updated_at
      - year
    BlankEnum:
      enum:
      - ''
    BlockTypeEnum:
      enum:
      - INTEGRATED_BLOCK
      - ROTATION_BLOCK
      type: string
      description: |-
        * `INTEGRATED_BLOCK` - Integrated Block
        * `ROTATION_BLOCK` - Rotation Block
    ComponentOutcomeEnum:
      enum:
      - PASS
      - FAIL
      - NA
      type: string
      description: |-
        * `PASS` - Pass
        * `FAIL` - Fail
        * `NA` - Not Applicable
    ContactInfo:
      type: object
