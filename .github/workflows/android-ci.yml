name: Android CI
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android-ci.yml"]
  push:
    paths: ["android/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: chmod +x gradlew
      - run: ./gradlew --version
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
