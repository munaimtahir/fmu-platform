name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type Check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:coverage
      - name: Enforce coverage by area
        run: python3 ../scripts/check_coverage.py web --report coverage/coverage-final.json --output coverage/areas.json
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: frontend/coverage
          if-no-files-found: error
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          if-no-files-found: error
