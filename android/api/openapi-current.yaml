openapi: 3.0.3
info:
  title: SIMS API
  version: 1.0.0
  description: Student Information Management System API schema.
paths:
  /api/academics/academic-periods/:
    get:
      operationId: academics_academic_periods_list
      parameters:
      - in: query
        name: is_enrollment_open
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parent_period
        schema:
          type: integer
      - in: query
        name: period_type
        schema:
          type: string
          enum:
          - BLOCK
          - MODULE
          - YEAR
        description: |-
          Type of academic period

          * `YEAR` - Year
          * `BLOCK` - Block
          * `MODULE` - Module
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CLOSED
          - OPEN
        description: |-
          Period status (OPEN allows enrollment, CLOSED blocks it)

          * `OPEN` - Open
          * `CLOSED` - Closed
      tags:
      - academics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicPeriodList'
          description: ''
    post:
      operationId: academics_academic_periods_create
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicPeriod'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicPeriod'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicPeriod'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPeriod'
          description: ''
