        DEPRECATED: Use UnifiedLoginSerializer instead.

        A custom token obtain pair serializer that uses email instead of username.
        Kept for backward compatibility during transition period.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    EntryTypeEnum:
      enum:
      - debit
      - credit
      type: string
      description: |-
        * `debit` - Debit
        * `credit` - Credit
    Exam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        academic_period:
          type: integer
          description: Academic period this exam belongs to (required)
        academic_period_name:
          type: string
          readOnly: true
        department:
          type: integer
          nullable: true
          description: Department for this exam (nullable for combined exams)
        department_name:
          type: string
          readOnly: true
        title:
          type: string
          description: Exam title
          maxLength: 255
        exam_type:
          type: string
          description: Type of exam (e.g., 'Midterm', 'Final', 'Quiz')
          maxLength: 128
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Scheduled date and time for the exam
        published:
          type: boolean
          description: Whether this exam is published
        version:
          type: integer
          readOnly: true
          description: Version number for audit trail
        passing_mode:
          allOf:
          - $ref: '#/components/schemas/PassingModeEnum'
          description: |-
            Mode for determining pass/fail

            * `TOTAL_ONLY` - Total Only
            * `COMPONENT_WISE` - Component Wise
            * `HYBRID` - Hybrid
        pass_total_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Minimum total marks required to pass
        pass_total_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Minimum total percentage required to pass
        fail_if_any_component_fail:
          type: boolean
          description: If True, student fails if any mandatory component fails
        components:
          type: array
          items:
            $ref: '#/components/schemas/ExamComponent'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
