    PassingModeEnum:
      enum:
      - TOTAL_ONLY
      - COMPONENT_WISE
      - HYBRID
      type: string
      description: |-
        * `TOTAL_ONLY` - Total Only
        * `COMPONENT_WISE` - Component Wise
        * `HYBRID` - Hybrid
    PatchedAcademicPeriod:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        period_type:
          allOf:
          - $ref: '#/components/schemas/PeriodTypeEnum'
          description: |-
            Type of academic period

            * `YEAR` - Year
            * `BLOCK` - Block
            * `MODULE` - Module
        name:
          type: string
          description: Period name (e.g., 'Year 1', 'Block 1', 'Module A')
          maxLength: 128
        parent_period:
          type: integer
          nullable: true
          description: Parent period for hierarchical structure (YEAR -> BLOCK ->
            MODULE)
        parent_period_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          nullable: true
          description: Period start date
        end_date:
          type: string
          format: date
          nullable: true
          description: Period end date
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
    PatchedAddress:
      type: object
      description: Serializer for Address model.
      properties:
        id:
          type: integer
          readOnly: true
        person:
          type: integer
          description: Person this address belongs to
        type:
          allOf:
          - $ref: '#/components/schemas/AddressTypeEnum'
          description: |-
            Type of address

            * `mailing` - Mailing Address
            * `permanent` - Permanent Address
            * `temporary` - Temporary Address
            * `work` - Work Address
        street:
          type: string
          description: Street address
          maxLength: 255
        city:
          type: string
          description: City
          maxLength: 100
        state:
          type: string
          description: State/Province
          maxLength: 100
        postal_code:
          type: string
          description: Postal/ZIP code
          maxLength: 20
        country:
          type: string
          description: Country
          maxLength: 100
        is_primary:
          type: boolean
          description: Is this the primary address?
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
    PatchedAdjustment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        student_reg_no:
