          type: integer
          description: Person this contact info belongs to
        type:
          allOf:
          - $ref: '#/components/schemas/ContactInfoTypeEnum'
          description: |-
            Type of contact information

            * `phone` - Phone
            * `email` - Email
            * `emergency_contact` - Emergency Contact
            * `whatsapp` - WhatsApp
        value:
          type: string
          description: Contact value (phone number, email, etc.)
          maxLength: 255
        label:
          type: string
          description: Optional label (e.g., 'Work', 'Home')
          maxLength: 50
        is_primary:
          type: boolean
          description: Is this the primary contact for this type?
        is_verified:
          type: boolean
          description: Has this contact been verified?
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
      required:
      - created_at
      - id
      - person
      - type
      - updated_at
      - value
    ContactInfoTypeEnum:
      enum:
      - phone
      - email
      - emergency_contact
      - whatsapp
      type: string
      description: |-
        * `phone` - Phone
        * `email` - Email
        * `emergency_contact` - Emergency Contact
        * `whatsapp` - WhatsApp
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: Course code (e.g., 'ANAT-101', 'PHYS-201')
          maxLength: 32
        name:
          type: string
          description: Course name (e.g., 'Human Anatomy', 'Physiology')
          maxLength: 255
        department:
          type: integer
          description: Department offering this course
        department_name:
          type: string
          readOnly: true
        academic_period:
          type: integer
          nullable: true
          description: Academic period this course belongs to (optional)
        academic_period_name:
          type: string
          readOnly: true
        credits:
          type: integer
          maximum: 32767
          minimum: 0
          description: Credit hours for this course
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
      required:
      - academic_period_name
      - code
      - created_at
      - department
      - department_name
      - id
      - name
      - updated_at
    DayOfWeekEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Department name (e.g., 'Anatomy', 'Medicine', 'Surgery')
          maxLength: 128
        code:
          type: string
          description: Department code (e.g., 'ANAT', 'MED')
          maxLength: 32
        description:
          type: string
          description: Department description
        parent:
          type: integer
          nullable: true
          description: Parent department for hierarchical structure
        parent_name:
          type: string
          readOnly: true
        children_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the record was last updated.
      required:
      - children_count
      - created_at
      - id
      - name
      - parent
      - parent_name
      - updated_at
    EmailTokenObtainPair:
      type: object
