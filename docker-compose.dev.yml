# Development Docker Compose Configuration
# Redis is optional - system will work without it but background jobs will be disabled

services:
  db:
    image: postgres:16-alpine
    container_name: vexel_medsims_db_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vexel_medsims}
      POSTGRES_USER: ${POSTGRES_USER:-vexel_medsims_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vexel_medsims_postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vexel_medsims_redis_dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Redis is optional - comment out if not needed

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vexel_medsims_backend_dev
    env_file:
      - .env
    environment:
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
    depends_on:
      - db
    volumes:
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
    ports:
      - "127.0.0.1:8010:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/}
    container_name: vexel_medsims_frontend_dev
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  vexel_medsims_postgres_data_dev:
